# Opens a pull request when a GitHub Action or a Windows NuGet package has a
# new version or a security fix. Grouped so it is one PR a week, not ten.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: nuget
    directory: /windows
    schedule:
      interval: weekly
    ignore:
      # NAudio plays the siren. 3.0 replaced WasapiOut and ISampleProvider.Read,
      # so moving to it is a rewrite of SpeakerAudio.cs that needs testing on
      # real Windows audio, not a dependency bump.
      - dependency-name: NAudio.Wasapi
        update-types: ["version-update:semver-major"]
    groups:
      nuget:
        patterns: ["*"]
